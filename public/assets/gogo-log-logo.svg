<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="logoGGradient" x1="10" y1="10" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gogoTextGrad" x1="180" y1="50" x2="350" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="innerSheetGrad2" x1="50" y1="50" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="penGrad2" x1="110" y1="15" x2="135" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ICON SECTION (Center at x=80, y=80) -->
  <g filter="url(#logoShadow)">
    <!-- Outer "G" Circular Swoosh -->
    <path d="M 98 29 C 92 27 86 26 80 26 C 50.18 26 26 50.18 26 80 C 26 109.82 50.18 134 80 134 C 109.82 134 134 109.82 134 80 C 134 72 132.3 64.3 129.3 57.3 L 110 67.3 C 111.3 71.3 112 75.6 112 80 C 112 97.67 97.67 112 80 112 C 62.33 112 48 97.67 48 80 C 48 62.33 62.33 48 80 48 C 85.7 48 91 49.5 95.7 52 Z" 
          fill="url(#logoGGradient)" />

    <!-- Pen Nib -->
    <path d="M 114.7 21.3 L 129.3 36 L 117.3 48 L 102.7 33.3 Z" fill="url(#penGrad2)" />
    <path d="M 102.7 33.3 L 95.3 40.7 L 100.7 46 L 108 38.7 Z" fill="#ffffff" />
    <circle cx="97.3" cy="44" r="1" fill="#0072FF" />

    <!-- Central Document / Ledger Badge -->
    <rect x="53.3" y="56.7" width="56" height="49.3" rx="12" fill="url(#innerSheetGrad2)" stroke="#00E5FF" stroke-width="1.8" />
    <rect x="64" y="69.3" width="34.7" height="4.3" rx="2.15" fill="#FFFFFF" />
    <rect x="64" y="79.3" width="28" height="4.3" rx="2.15" fill="#38BDF8" />
    <rect x="64" y="89.3" width="32" height="4.3" rx="2.15" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g id="wordmark">
    <!-- GOGO LOG Text -->
    <text x="170" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.02em">
      <tspan fill="url(#gogoTextGrad)">GOGO </tspan>
      <tspan fill="#FFFFFF">LOG</tspan>
    </text>

    <!-- Subtitle: TRACK • RECORD • GROW -->
    <g transform="translate(172, 118)">
      <!-- Left line -->
      <line x1="0" y1="-4" x2="35" y2="-4" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- Text -->
      <text x="48" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="0.28em">
        TRACK <tspan fill="#00E5FF">•</tspan> RECORD <tspan fill="#00E5FF">•</tspan> GROW
      </text>

      <!-- Right line -->
      <line x1="285" y1="-4" x2="320" y2="-4" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>

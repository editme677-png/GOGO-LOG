<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Background glow & drop shadow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyberGGradient" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="innerSheetGrad" x1="85" y1="85" x2="165" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="penGradient" x1="160" y1="30" x2="185" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="neonGlowGrad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="url(#neonGlowGrad)" stroke-width="6" opacity="0.6" />

  <!-- Outer "G" Circular Swoosh -->
  <!-- Sweeps from top around counter/clockwise creating a stylized, modern cyber 'G' with high energy -->
  <path d="M 148 44 C 139 41 129 39 120 39 C 75.26 39 39 75.26 39 120 C 39 164.74 75.26 201 120 201 C 164.74 201 201 164.74 201 120 C 201 108 198.5 96.5 194 86 L 165 101 C 167 107 168 113.4 168 120 C 168 146.51 146.51 168 120 168 C 93.49 168 72 146.51 72 120 C 72 93.49 93.49 72 120 72 C 128.5 72 136.5 74.2 143.5 78 Z" 
        fill="url(#cyberGGradient)" 
        filter="url(#shadow)" />

  <!-- The Stylized Pen Nib at the Top Right of the G -->
  <g filter="url(#shadow)">
    <path d="M 172 32 L 194 54 L 176 72 L 154 50 Z" fill="url(#penGradient)" />
    <!-- Nib tip -->
    <path d="M 154 50 L 143 61 L 151 69 L 162 58 Z" fill="#ffffff" />
    <circle cx="146" cy="66" r="1.5" fill="#0072FF" />
  </g>

  <!-- Central Rounded Tablet / Document Badge representing the Shop Ledger -->
  <g filter="url(#shadow)">
    <rect x="80" y="85" width="84" height="74" rx="18" fill="url(#innerSheetGrad)" stroke="#00E5FF" stroke-width="2.5" />
    <!-- Document Lines (Logged entries) -->
    <rect x="96" y="104" width="52" height="6.5" rx="3.25" fill="#FFFFFF" />
    <rect x="96" y="119" width="42" height="6.5" rx="3.25" fill="#38BDF8" />
    <rect x="96" y="134" width="48" height="6.5" rx="3.25" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
